[versions]
agp = "9.4.0" # pinned below latest stable (9.3.1): installed Android Studio (Otter, 2025.2) only supports up to an AGP 9.0.0 release candidate; bump back to 9.3.1+ once Android Studio is updated to Quail 3 (2026.1.3) or newer, which supports AGP up to 9.3
konsist = "0.17.3"
detekt = "1.23.8"
kotlin = "2.4.10"
googleServices = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.8"
sonarqube = "7.5.0.8588"
koin = "4.2.2"
coroutines = "1.11.0"
# Kept in lockstep with jbLifecycle below (both 2.10.0): androidx.lifecycle version-aligns its whole
# artifact group, so pinning this one higher than jbLifecycle's Android-target transitive lifecycle
# artifacts would silently pull those up too, past the compileSdk 37 wall documented on jbLifecycle.
lifecycle = "2.10.0"
# Frozen at 1.18.0: androidx.core 1.19.0's AAR metadata declares minCompileSdk=37, and this project
# deliberately stays on compileSdk 36 (a separate decision from this Kotlin/AGP/Gradle upgrade).
androidxCore = "1.19.0"
datastore = "1.2.1"
navigationKtx = "2.10.0"
accompanistPermissions = "0.37.3"
# These three are what Compose Multiplatform 1.11.1 pins the androidx.compose artifacts to, and
# they are declared here rather than left to conflict resolution so the catalog states the version
# the build actually uses. Compose Multiplatform publishes `strictly` constraints on the whole
# androidx.compose graph, so anything lower written here would be silently overridden anyway.
composeUi = "1.11.2"
composeMaterial3 = "1.4.0"
# JetBrains Compose Multiplatform, the artifact set a shared UI module compiles against. JetBrains
# keeps 1.11.x forward-compatible with new stable Kotlin releases with no strict version pairing, so
# it stays put across the Kotlin 2.4.10 bump above. It does not replace composeUi/composeMaterial3:
# those stay for the Android-only modules and the JVM test artifacts, and on the Android target
# Compose Multiplatform resolves to the very same androidx.compose artifacts anyway.
composeMultiplatform = "1.12.0"
# Frozen at 1.7.8, which is where androidx stopped publishing it. material3 1.4.0 dropped
# material-icons-core from its api dependencies, so an app that uses Icons.Default.* now asks for
# the icon set by name instead of inheriting it. Deliberately unversioned against composeUi.
materialIconsCore = "1.7.8"
composeNavigation = "2.10.0"
composeActivity = "1.13.0"
composeKoin = "4.2.2"
firebaseBom = "34.18.0"
googleAds = "25.4.0"
parseSDK = "4.4.0"

retrofit = "3.0.0"
retrofitConverter = "3.0.0"
# Frozen at 4.12.0 deliberately: retrofit 3.0.0's own POM depends on exactly okhttp 4.12.0, and
# okhttp jumped to a breaking 5.x major line (a Kotlin-first rewrite) after this. Bumping this alone
# would pull okhttp 5.x transitively via logging-interceptor while retrofit still expects 4.x,
# a real binary mismatch in the same module. Re-check once retrofit itself moves to an okhttp 5.x line.
okhttpInterceptor = "4.12.0"

ktor = "3.5.2"
kotlinxIo = "0.9.1"

kotlinxSerialization = "1.11.0"

# JetBrains' multiplatform ports of navigation-compose and the lifecycle-viewmodel family, for the
# one module (:presentation) that needs them on iOS too. Published under androidx.* package names
# for source compatibility with the AndroidX originals, but under different Maven coordinates
# (org.jetbrains.androidx.*), so an Android-only module keeps using the plain AndroidX artifacts
# above (navigationKtx et al.) — the two are not interchangeable at the dependency level even
# though the code reads identically.
jbNavigationCompose = "2.9.2"
# Was frozen below 2.11.0 because that line's Android variant (lifecycle-viewmodel-compose-android)
# declared an AGP 9.1.0+ requirement in its Gradle module metadata, and this project ran AGP 8.13.2.
# Now on AGP 9.3.1, so that original reason is gone, but 2.11.0 introduced its own new constraint:
# its Android-variant AAR metadata now declares minCompileSdk=37, and this project deliberately
# stays on compileSdk 36 (a separate decision from this upgrade), so the freeze stays at 2.10.0.
jbLifecycle = "2.11.0"

junit4 = "4.13.2"
# JUnit unified Jupiter/Platform/Vintage versioning at major version 6 (previously 5.x/1.x); this
# project moved onto that line since it is now the latest stable release across all three artifacts.
junit5 = "6.1.3"
junitPlatformLauncher = "6.1.3"
mockk = "1.14.11"
mockkAndroid = "1.14.11"
androidTestRules = "1.7.0"
uiAutomator = "2.4.0"
koinTest = "4.2.2"
androidxNavTesting = "2.10.0"
# Deliberately left tracking composeUi (both at 1.11.2) rather than the newer 1.12.0 androidx.compose.ui
# has otherwise published: this artifact is in the same androidx.compose.ui group that Compose
# Multiplatform 1.11.1 constrains `strictly` to 1.11.2 across the graph, so keeping it in lockstep
# avoids asking Gradle to resolve two different requirements against that constraint.
uiTestJunit4Android = "1.11.2"
robolectric = "4.16.1"
turbine = "1.2.1"

[libraries]
# Used only by the build-logic convention plugins to compile against the AGP / Kotlin DSL.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
bolts-tasks = { module = "com.github.parse-community.Parse-SDK-Android:parse", version.ref = "parseSDK" }
google-services = { module = "com.google.gms:google-services", version.ref = "googleServices" }
firebase-crashlytics-gradle = { module = "com.google.firebase:firebase-crashlytics-gradle", version.ref = "firebaseCrashlyticsPlugin" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
kotlinStdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
androidxCore = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
koin = { module = "io.insert-koin:koin-android", version.ref = "koin" }
# The multiplatform artifact: koin-android depends on this exact version transitively, so a
# commonMain module (which cannot depend on koin-android, an Android/JVM-only artifact) pins the
# same version explicitly rather than letting Gradle's resolution pick one — two versions of
# koin-core in one dependency graph is a real way to get a binary-incompatible Koin at runtime.
koinCore = { module = "io.insert-koin:koin-core", version.ref = "koin" }
coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
lifecycleViewModelKtx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycleRuntimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycleLiveData = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycleProcess = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
navigationKtx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigationKtx" }
accompanistPermissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }
composeUi = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
composeMaterial3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
materialIconsCore = { module = "androidx.compose.material:material-icons-core", version.ref = "materialIconsCore" }
composeNavigation = { module = "androidx.navigation:navigation-compose", version.ref = "composeNavigation" }
composePreview = { module = "androidx.compose.ui:ui-tooling", version.ref = "composeUi" }
composeActivity = { module = "androidx.activity:activity-compose", version.ref = "composeActivity" }
koinCompose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "composeKoin" }
# The multiplatform Compose ViewModel-injection DSL (koinViewModel() usable from commonMain),
# distinct from koin-androidx-compose above the same way koinCore is distinct from koin-android.
koinComposeViewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "composeKoin" }
jb-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jbNavigationCompose" }
jb-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "jbLifecycle" }
jb-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jbLifecycle" }
jb-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jbLifecycle" }
jb-lifecycle-savedstate = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "jbLifecycle" }
firebaseBom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
# The -ktx artifacts merged their Kotlin extensions into the plain modules below years ago and were
# frozen at their last release; the firebase-bom bump stopped listing them at all, which surfaced as
# an unresolved (version-less) dependency. Use the plain module names, same as firebaseConfig already did.
firebaseAnalytics = { module = "com.google.firebase:firebase-analytics" }
firebaseMessaging = { module = "com.google.firebase:firebase-messaging" }
firebaseCrashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebaseConfig = { module = "com.google.firebase:firebase-config" }
googleAds = { module = "com.google.android.gms:play-services-ads", version.ref = "googleAds" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit5 = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junitVintageEngine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit5" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatformLauncher" }
koinTest = { module = "io.insert-koin:koin-test", version.ref = "koinTest" }
koinTestJUnit5 = { module = "io.insert-koin:koin-test-junit5", version.ref = "koinTest" }
androidxNavTesting = { module = "androidx.navigation:navigation-testing", version.ref = "androidxNavTesting" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttpInterceptor" }
mockkAndroid = { module = "io.mockk:mockk-android", version.ref = "mockkAndroid" }
androidTestRules = { module = "androidx.test:rules", version.ref = "androidTestRules" }
uiAutomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiAutomator" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofitConverter = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofitConverter" }
okhttpInterceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttpInterceptor" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
ui-test-junit4-android = { group = "androidx.compose.ui", name = "ui-test-junit4-android", version.ref = "uiTestJunit4Android" }
ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "composeUi" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# The Compose *compiler* plugin, shipped with Kotlin itself, so it is the same plugin for an
# Android-only Compose module and a multiplatform one. Only the artifact-providing plugin below
# differs between the two styles.
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

# Convention plugins provided by the included build-logic build.
templateproject-android-application = { id = "templateproject.android.application", version = "unspecified" }
templateproject-android-application-compose = { id = "templateproject.android.application.compose", version = "unspecified" }
templateproject-android-library = { id = "templateproject.android.library", version = "unspecified" }
templateproject-android-library-compose = { id = "templateproject.android.library.compose", version = "unspecified" }
templateproject-kmp-library = { id = "templateproject.kmp.library", version = "unspecified" }
templateproject-kmp-library-compose = { id = "templateproject.kmp.library.compose", version = "unspecified" }
