name: Android Gradle Build on push and PR

# Feature branches are validated through their pull request (one run per commit). Direct `push`
# CI is limited to the long-lived branches, so a branch with an open PR no longer fires the
# pipeline twice (once for `push`, once for `pull_request`) on every commit. To get CI on a
# work-in-progress feature branch, open a draft PR.
on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ master, develop ]

# When a newer commit lands on the same branch / PR, cancel the in-progress run instead of letting
# superseded builds keep burning runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Gradle_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Load .env file
        uses: xom9ikk/dotenv@v2
        with:
          path: .github/workflows/parameters
          mode: normalParameters

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE }}
        run: |
          TMP_KEYSTORE_FILE_PATH="${RUNNER_TEMP}"/keystore
          mkdir "${TMP_KEYSTORE_FILE_PATH}"
          echo $ENCODED_STRING | base64 -di > "${TMP_KEYSTORE_FILE_PATH}"/${{ env.KEYSTORE_FILE_NAME }}
          echo "${TMP_KEYSTORE_FILE_PATH}"/${{ env.KEYSTORE_FILE_NAME }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle (with dependency & build caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lint

      # `assemble` (not `build`) so this job builds the signed artifacts + lints, without
      # re-running the unit tests that the Unit_tests job already runs (build = assemble + check,
      # and check re-runs lint + test). Keeps each piece of work to a single run.
      - name: Assemble (all variants, signed release)
        run: ./gradlew assemble
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

  Unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle (with dependency & build caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

  Instrumented_tests:
    # End-to-end UI flows on an emulator (the hermetic AppFlowsUiTest suite). The Android emulator
    # needs a hypervisor-accelerated host: GitHub's Apple Silicon (arm64) macOS runners don't expose
    # one to the emulator (it fails to boot — HVF unsupported / arm64-v8a crashes), so this pins the
    # last Intel x86_64 image, macos-15-intel (available until ~Aug 2027). API 30 stays below API 33,
    # so notifications need no runtime-permission dialog that could steal focus from the Compose
    # tree. The AVD is generated once and cached as a snapshot, so only a cold cache pays the boot
    # cost; later runs restore it. Scoped to flavor1Debug so it runs a single variant.
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle (with dependency & build caching)
        uses: gradle/actions/setup-gradle@v4

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedFlavor1DebugAndroidTest --stacktrace

  Sonar_analysis:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle (with dependency & build caching)
        uses: gradle/actions/setup-gradle@v4

      # The SonarQube Gradle plugin is not compatible with Gradle's configuration cache (enabled in
      # gradle.properties), so run this invocation with --no-configuration-cache; otherwise the
      # task aborts with a configuration-cache report. Skipped when SONAR_TOKEN isn't configured
      # (e.g. forks). continue-on-error keeps a SonarCloud-side hiccup from failing the pipeline —
      # remove it to make Sonar a hard gate once you've confirmed a clean run.
      - name: Sonar analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        run: ./gradlew buildFlavor1Debug sonar --no-configuration-cache --info
