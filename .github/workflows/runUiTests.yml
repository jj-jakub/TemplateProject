name: Run UI Tests on demand

on: workflow_dispatch

jobs:
  UI_Tests:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle (with dependency & build caching)
        uses: gradle/actions/setup-gradle@v4

      # The emulator needs hypervisor acceleration, which GitHub's Apple Silicon runners don't expose
      # to it, so this runs on the Intel image (macos-15-intel) with an x86_64 image. connectedCheck
      # runs the instrumented tests across all flavors.
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedCheck --stacktrace