name: Build and unit tests

# The gate every change passes: build, test, lint and static analysis on every pull request (and on
# pushes to the long-lived branches). Feature branches are validated through their pull request, so
# direct `push` CI is limited to develop/master and a branch with an open PR no longer fires the
# pipeline twice on every commit. To get CI on a work-in-progress branch, open a draft PR.
on:
  pull_request:
  push:
    branches: [ develop, master ]
  workflow_dispatch:

permissions:
  contents: read

# When a newer commit lands on the same branch or PR, cancel the in-progress run instead of letting
# superseded builds keep burning runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build_and_test:
    runs-on: ubuntu-latest
    # Without this a hung Gradle daemon runs to the 6 hour default before the job is killed.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android-build

      - name: Load CI parameters
        uses: ./.github/actions/load-ci-parameters

      - name: Resolve artifact names
        uses: ./.github/actions/resolve-artifact-names
        with:
          flavor: ${{ env.DEFAULT_FLAVOR }}

      # Assembling the debug APK is the compile check; the unit tests include the Konsist
      # architecture rules, which is what keeps the module graph honest.
      - name: Build debug and run unit tests
        run: ./gradlew ${{ env.GRADLE_TASK_DEBUG_APK }} ${{ env.GRADLE_TASK_UNIT_TEST }} --stacktrace

      - name: Lint
        if: env.GRADLE_TASK_LINT != ''
        run: ./gradlew ${{ env.GRADLE_TASK_LINT }} --stacktrace

      # Detekt is a root task deliberately kept out of `check` so the unit-test loop stays fast,
      # which also means it only ever runs here if it is invoked by name.
      - name: Static analysis
        if: env.GRADLE_TASK_STATIC_ANALYSIS != ''
        run: ./gradlew ${{ env.GRADLE_TASK_STATIC_ANALYSIS }} --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            app/build/reports/
            domain/build/reports/
            networking/build/reports/
            core/build/reports/
            design/build/reports/
            presentation/build/reports/
          if-no-files-found: ignore

  iOS_framework_build:
    # Verifies the Kotlin/Swift boundary actually links (embedAndSignAppleFrameworkForXcode), not
    # just that presentation's iosSimulatorArm64 target compiles — a real Info.plist/build-settings
    # mistake in iosApp/project.yml, or a Swift-side compile error, would slip through a Gradle-only
    # check. No app install/launch here (that would need a booted simulator and buys little extra
    # signal for a PR gate); IosKoinGraphTest is what verifies the Koin graph actually resolves.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android-build

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate
        working-directory: iosApp

      # A named simulator, not the generic "platform=iOS Simulator" destination: the generic form
      # defaults to a multi-arch build including x86_64, which this project has no Kotlin/Native
      # target for ("Unknown iOS simulator arch: 'x86_64'"). iPhone 16 ships on every macos-15
      # runner's preinstalled Xcode.
      - name: Build the iOS app for the simulator
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -configuration Debug build
        working-directory: iosApp

  Instrumented_tests:
    # End-to-end UI flows on an emulator (the hermetic AppFlowsUiTest suite). The Android emulator
    # needs a hypervisor-accelerated host: GitHub's Apple Silicon (arm64) macOS runners don't expose
    # one to the emulator (it fails to boot — HVF unsupported / arm64-v8a crashes), so this pins the
    # last Intel x86_64 image, macos-15-intel (available until ~Aug 2027). API 30 stays below API 33,
    # so notifications need no runtime-permission dialog that could steal focus from the Compose
    # tree. The AVD is generated once and cached as a snapshot, so only a cold cache pays the boot
    # cost; later runs restore it.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android-build

      - name: Load CI parameters
        uses: ./.github/actions/load-ci-parameters

      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew ${{ env.GRADLE_TASK_INSTRUMENTED_TEST }} --stacktrace

  Sonar_analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android-build

      # The SonarQube Gradle plugin is not compatible with Gradle's configuration cache (enabled in
      # gradle.properties), so run this invocation with --no-configuration-cache; otherwise the
      # task aborts with a configuration-cache report. Skipped when SONAR_TOKEN isn't configured
      # (e.g. forks). continue-on-error keeps a SonarCloud-side hiccup from failing the pipeline —
      # remove it to make Sonar a hard gate once you've confirmed a clean run.
      - name: Sonar analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        run: ./gradlew buildFlavor1Debug sonar --no-configuration-cache --info
