name: Set up Android build environment
description: >
  Installs JDK 17, the Android SDK and Gradle, required by every workflow that invokes the Gradle
  wrapper. Every `uses:` here is pinned to a commit SHA rather than a floating tag, because a
  retagged or compromised release would otherwise enter a build that handles the signing keystore;
  Dependabot keeps the pins moving (see .github/dependabot.yml).

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

    # app/build.gradle.kts reads this to stamp BuildConfig.ciBuildNumber, so a build produced by CI
    # can be told apart from a local one. Written here rather than in each workflow because every
    # workflow that builds anything wants it.
    - name: Record the CI build number
      shell: bash
      run: echo "ciBuildNumber=${GITHUB_RUN_NUMBER}" > "$GITHUB_WORKSPACE/local.properties"
