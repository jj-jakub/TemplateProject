# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Cache task outputs across builds and run independent module tasks in parallel.
org.gradle.caching=true
org.gradle.parallel=true
# Reuse the configuration phase between builds (Gradle 9 makes this the default).
org.gradle.configuration-cache=true
# AGP 9 turns on "built-in Kotlin" compilation by default, which would conflict with this project's
# own explicitly-applied Kotlin Gradle Plugin (pinned above AGP's bundled one). Keep the explicit
# org.jetbrains.kotlin plugins doing the compiling instead, matching the pre-AGP-9 build shape.
# ESCAPE HATCH: AGP 9 hard-fails applying org.jetbrains.kotlin.android at all once android.newDsl
# defaults to true ("plugin is not compatible with AGP's 9.0 new DSL") — there is no supported
# combination that keeps the new DSL and the classic Kotlin Gradle Plugin side by side; AGP's own
# docs pair the opt-out of built-in Kotlin with opting out of the new DSL too. Adopting built-in
# Kotlin instead was ruled out for this pass (it would also silently drop compilation from the
# pinned Kotlin 2.4.10 down to AGP's bundled 2.2.10), so both flags are set together here as a
# deliberate, documented last resort. android.newDsl is deprecated and slated for removal in AGP
# 10, at which point this project must migrate to built-in Kotlin for real.
android.builtInKotlin=false
android.newDsl=false