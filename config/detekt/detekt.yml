# Detekt configuration for TemplateProject.
# Used with `buildUponDefaultConfig = true`, so this only overrides the defaults below; the full
# default rule set still applies. Run `./gradlew detekt`; regenerate the baseline after large
# changes with `./gradlew detektBaseline`.

build:
  maxIssues: 0

complexity:
  LongParameterList:
    # ViewModels / composables legitimately take several injected dependencies / slots. Raised from
    # the detekt default of 6 on the game/game-review branch, where a "kitchen sink" demo screen
    # (theme + API status + save progress + achievements, one flattened stateless composable per
    # this codebase's own testability convention) and its ViewModel outgrew it. Not tied to any one
    # class's exact current count — that would just mean re-tuning this on every unrelated growth.
    functionThreshold: 10
    constructorThreshold: 10
  TooManyFunctions:
    active: false

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: false

style:
  MagicNumber:
    # Dimensions, colors and sample data carry many literals in a UI template.
    ignoreNumbers: ['-1', '0', '1', '2', '3', '4', '5', '8', '16', '24', '100']
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'ThemePreviews']
  ReturnCount:
    max: 4
